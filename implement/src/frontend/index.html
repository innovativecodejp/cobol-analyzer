<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COBOL Analyzer</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app">
    <header id="header">
      <h1>COBOL Analyzer</h1>
    </header>
    <main id="main">
      <div id="left-pane">
        <div id="editor-container"></div>
        <button id="analyze-btn">Analyze</button>
      </div>
      <div id="right-pane">
        <div id="tabs">
          <button class="tab-btn active" data-tab="ast">AST</button>
          <button class="tab-btn" data-tab="cfg">CFG</button>
          <button class="tab-btn" data-tab="dfg">DFG</button>
        </div>
        <div id="diagram-area">
          <div id="tab-ast" class="tab-panel active"></div>
          <div id="tab-cfg" class="tab-panel"></div>
          <div id="tab-dfg" class="tab-panel"></div>
        </div>
      </div>
    </main>
    <footer id="mdi-bar">
      <div id="mdi-panel"></div>
    </footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
